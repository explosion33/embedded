[project]
name = "embedded"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []


[dependency-groups]
dev = [
    "click==8.3.0",
    "ruff>=0.15.10",
    "pyright>=1.1.414",
    "types-pyyaml>=6.0.12.20260408",
    "gitignore-parser==0.1.13",
    "pyocd==0.45.1",
    # Adds clang-format to the uv.lock allowing bazel rules python to read and use
    # these packages.
    "clang-format==23.1.1",
]

# Configure python linting
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # Errors
    "F",   # Pyflakes
    "W",   # Warnings
    "I",   # Isort
    "B",   # Flake8
    "UP",  # PyUprade
    "SIM", # Flake8 Simplify
    "RUF", # Ruff-Specific
    "N",   # Pep8 Naming
]
# Don't auto-remove imports
unfixable = ["F401"]

# Configure type checking. Point pyright at the uv-managed venv so third-party imports
# resolve.
[tool.pyright]
venvPath = "."
venv = ".venv"
