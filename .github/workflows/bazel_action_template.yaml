name: Bazel Action Template

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: str
        description: "The bazel action to execute (run, test, build)"
      target:
        required: true
        type: string
        description: "The bazel target string this test invokes (e.g. :target)"
      args:
        required: false
        type: string
        description: "Optional arguments to pass to the bazel invokation"
        default: ""
      uv_sync:
        required: false
        type: boolean
        description: "Create the uv managed .venv before running, for targets that need it."
        default: false

jobs:
  run-tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # pyright resolves third-party imports through .venv, which lives outside of bazel.
      - name: Set up uv
        if: inputs.uv_sync
        uses: astral-sh/setup-uv@v6
        with:
          # Keep in step with the uv pinned in MODULE.bazel.
          version: "0.12.15"
          enable-cache: true

      - name: uv Sync
        if: inputs.uv_sync
        run: uv sync --locked

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Scoping the disk cache by the test target helps prevent cache conflicts
          disk-cache: ${{ github.workflow }}-${{ inputs.target }}
          repository-cache: true

      - name: Perform Bazel Action
        run: bazel ${{ inputs.action }} -c opt ${{ inputs.target }} --test_output=errors -- ${{ inputs.args }}
