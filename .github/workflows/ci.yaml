name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/bazel_action_template.yaml
    with:
      action: "build"
      target: '//...'
  host-tests:
    uses: ./.github/workflows/bazel_action_template.yaml
    with:
      action: "test"
      target: '//...'
  lint:
    uses: ./.github/workflows/bazel_run_template.yaml
    with:
      action: "run"
      target: ':lint'
      args: "--check"
      uv_sync: true
